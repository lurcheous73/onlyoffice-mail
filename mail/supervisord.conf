[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/oo-mail/supervisor.pid
user=root
[program:dovecot]
command=/usr/sbin/dovecot -F
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:postfix]
command=/usr/sbin/postfix start-fg
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
