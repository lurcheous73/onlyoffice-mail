dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols = imap pop3 lmtp sieve
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_mechanisms = plain login
auth_allow_cleartext = no
auth_username_format = %{user | lower}
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /run/tls/server.crt
ssl_server_key_file = /run/tls/server.key
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000
mail_driver = maildir
mail_path = ~/Maildir
default_process_limit = 50
default_client_limit = 200
default_vsz_limit = 512M
passdb pam {
  service_name = oo-%{protocol}
}
sql_driver = mysql
mysql database {
  dbname = onlyoffice_mailserver
  user = mailreader
  password = READER_SECRET
}
userdb sql {
  iterate_query = SELECT username AS user FROM mailbox WHERE active=1
  query = SELECT CONCAT(m.storagebasedirectory,'/',m.storagenode,'/',m.maildir) AS home, m.quota*1048576 AS quota_storage_size FROM mailbox m JOIN domain d ON d.domain=m.domain WHERE m.username='%{user | lower}' AND m.active=1 AND m.expired>UTC_TIMESTAMP() AND d.active=1 AND d.expired>UTC_TIMESTAMP() AND d.backupmx=0 AND ('%{protocol}'<>'lmtp' OR (m.enabledeliver=1 AND m.enablelda=1 AND m.enablelmtp=1))
}
namespace inbox {
  type = private
  separator = /
  prefix =
  inbox = yes
  mailbox INBOX {
    auto = subscribe
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}
mail_plugins {
  quota = yes
}
quota mailbox {
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
protocol lmtp {
  postmaster_address = postmaster@lab.invalid
  mail_plugins {
    sieve = yes
  }
}
sieve_script personal {
  type = personal
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service auth-worker {
  process_limit = 4
}
service lmtp {
  inet_listener lmtp {
    listen = 127.0.0.1
    port = 2424
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
